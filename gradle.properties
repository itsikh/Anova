# JVM heap, worker count, and the Kotlin daemon heap are set by
# ~/bin/gradle-tune in ~/.gradle/gradle.properties so they scale with
# this machine's CPU and RAM (and retune at boot after a VM resize).
# Do not set org.gradle.jvmargs, org.gradle.workers.max, or
# kotlin.daemon.jvmargs here — they would override the tuner.

# NOTE: org.gradle.java.home is deliberately NOT set here. It used to pin the Mac's Android Studio
# JBR, which made the project build on exactly one machine. Set the JDK per machine instead:
# JAVA_HOME in your shell, or a line in ~/.gradle/gradle.properties (not committed), e.g.
#   org.gradle.java.home=/path/to/jdk-21
# removed for gradle-tune: org.gradle.jvmargs=-Xmx10240m -Dfile.encoding=UTF-8 -XX:+UseParallelGC -XX:MaxMetaspaceSize=512m
# removed for gradle-tune: kotlin.daemon.jvm.options=-Xmx2048m
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# Build performance
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
kotlin.incremental=true
ksp.incremental=true
